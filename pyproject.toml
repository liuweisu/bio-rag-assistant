[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-rag-assistant"
version = "0.1.0"
description = "Retrieval-augmented question answering over bioinformatics notes, with cited answers and an evaluation set"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=0.80", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
dense = ["sentence-transformers>=3"]

[project.scripts]
biorag = "biorag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]
